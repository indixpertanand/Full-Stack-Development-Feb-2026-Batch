<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Elements</title>
</head>
<body>
    <header>
        <h1>Media Elements</h1>
    </header>
    <main>
        <section>
            <h2>Audio</h2>
            <audio src="./audios/audio1.mp3" controls autoplay muted loop></audio>

            <h3>Multi Source</h3>
            <audio controls autoplay muted loop>
                <source src="./audios/audio1.mp3" type="audio/mp3">
                <source src="./audios/audio2.wav" type="audio/wav">
            </audio>
        </section>
        <section>
            <h2>Video</h2>
            <video width="400px" src="./videos/video1.mp4" controls autoplay muted loop>

            </video>

            <h2>Video with captions</h2>
            <video width="400" poster="./videos/video-poster.jpg" src="./videos/ElephantsDream.mp4" controls>
                <track src="./subtitle/video2.vtt" kind="subtitles" srclang="en" label="English"></track>
                <track src="./subtitle/video2-hi.vtt" kind="subtitles" srclang="hi" label="Hindi"></track>
            </video>
        </section>

        <section>
            <h2>Iframe</h2>
            <h3>Embedding a Document</h3>
            <!-- <iframe width="400" height="600" src="./docs/HTML-Media-Elements.pdf" frameborder="0"></iframe> -->
            <iframe width="400" height="600" src="//indixpert.com" frameborder="0"></iframe>
            <iframe width="400" height="260" src="https://www.youtube.com/embed/U1Kic6F586o?si=56UFDV7dTeps6t0n" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d224568.47634804138!2d76.82526274931517!3d28.422803847976084!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390d19d582e38859%3A0x2cf5fe8e5c64b1e!2sGurugram%2C%20Haryana!5e0!3m2!1sen!2sin!4v1783511693254!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>
        <section>
            <h2>SVG</h2>
            <svg width="200" height="150">
                <circle cx="100" cy="75" r="72" stroke="red" stroke-width="5" fill="aqua" />
            </svg>
        </section>
    </main>
</body>
</html>
