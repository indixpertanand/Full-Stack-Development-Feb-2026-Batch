<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>
<body>
    <header>
        <h1>HTML Form</h1>
    </header>
    <main>
        <section>
            <h2>User Registration</h2>
            <form action="#" method="">
                <div>
                    <label for="serviceId">Service id</label>
                    <input type="number" id="ser" name="serviceId" placeholder="Service Id" value="1001" readonly>
                </div>
                <div>
                    <label for="disabledField">Disabled Field</label>
                    <input type="number" id="disabledField" name="disabled" placeholder="Disabled Field" value="1001" disabled>
                </div>
                <div>
                    <label for="name">Name <span style="color: red;">*</span></label>
                    <input type="text" pattern="[a-zA-Z][a-zA-Z0-9-_]{4,24}" minlength="3" maxlength="50" autofocus id="name" name="name" placeholder="Name" required>
                </div>
                <div>
                    <label for="fathersname">Father's Name</label>
                    <input type="text" id="fathersname" name="fathersname" placeholder="Father's Name">
                </div>                
                <div>
                    <label for="email">Email <span style="color: red;">*</span></label>
                    <input type="email" pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}" id="email" name="email" placeholder="email" required>
                </div>
                <div>
                    <label for="phone">Phone Number</label>                
                    <input type="number" id="phone" min="6000000000" name="phone" placeholder="phone Number">
                </div>
                <div>
                    <label for="password">Password <span style="color: red;">*</span></label>                
                    <input type="password" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&^#()_\-+=])[A-Za-z\d@$!%*?&^#()_\-+=]{8,32}" id="password" name="password" placeholder="password" required>
                </div>
                <div>
                    <label for="country">Country</label>
                    <select name="country" id="country" multiple>
                        <option value="">Select Country</option>
                        <option value="India" selected>India</option>
                        <option value="China">China</option>
                        <option value="Nepal">Nepal</option>
                        <option value="Bhutan">Bhutan</option>
                        <option value="Bangladesh">Bangladesh</option>
                        <option value="Mayanmar">Mayanmar</option>
                        <option value="Srilanka">Srilanka</option>
                        <option value="Pakistan">Pakistan</option>
                    </select>
                </div>
                <div>
                    <label for="dob">Date Of Birth <span style="color: red;">*</span></label>                
                    <input type="date" id="dob" min="1966-07-10" max="2008-07-10" name="dob" placeholder="DOB" required>
                </div>
                <div>
                    <label for="gender">Gender</label>            
                    <input type="radio" id="male" name="gender" value="Male"><label for="male"> Male</label>
                    <label for="female"><input type="radio" id="female" name="gender" value="Female"> Female</label>
                    <label for="others"><input type="radio" id="others" name="gender" value="Others"> Others</label>
                </div>
                <div>
                    <label for="skills">Skills</label>            
                    <input type="checkbox" id="c" name="skills" value="C"><label for="c"> C</label>
                    <label for="html"><input type="checkbox" id="html" name="skills" value="Html"> Html</label>
                    <label for="python"><input type="checkbox" id="python" name="skills" value="Python"> Python</label>
                    <label for="bootstrap"><input type="checkbox" id="bootstrap" name="skills" value="Bootstrap"> Bootstrap</label>
                    <label for="javascript"><input type="checkbox" id="javascript" name="skills" value="Javascript"> Javascript</label>
                </div>
                <div>
                    <label for="bio">BIO</label>
                    <textarea name="bio" id="bio" rows="4" cols="40"></textarea>
                </div>
                <button>Submit</button>
            </form>
        </section>
    </main>
</body>
</html>
