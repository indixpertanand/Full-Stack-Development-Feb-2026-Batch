<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Handling</title>
    
    <script src="./script.js"></script>
</head>
<body>
    <script>        
        try{
            let result = add(4, 5)
            console.log(result)
        }catch(err){
            console.log(err.name, err.message, err.stack)
        }finally{
            console.log("programme Completed")
        }
    </script>
</body>
</html>
