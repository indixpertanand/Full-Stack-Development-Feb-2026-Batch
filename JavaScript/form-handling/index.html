<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Handling</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <main>
        <section>
            <div class="container">
                <div class="col-lg-8 mx-auto">
                    <h2>User Registration</h2>
                    <form action="#" method="" novalidate id="registrationForm">
                        <div class="row row-cols-lg-2 gy-4">
                            <div class="col">
                                <label class="form-label" for="serviceId">Service id</label>
                                <input type="number" class="form-control" id="serviceId" name="serviceId"
                                    placeholder="Service Id" value="">
                                <span class="text-danger small" id="serviceErr"></span>
                            </div>
                            <div>
                                <label class="form-label" for="disabledField">Disabled Field</label>
                                <input type="number" class="form-control" id="disabledField" name="disabled"
                                    placeholder="Disabled Field" value="1001" disabled>
                            </div>
                            <div>
                                <label class="form-label" for="name">Name <span style="color: red;">*</span></label>
                                <input type="text" class="form-control form-control-sm"
                                    pattern="[a-zA-Z][a-zA-Z0-9-_]{4,24}" minlength="3" maxlength="50" autofocus
                                    id="name" name="name" placeholder="Name" required>
                            </div>
                            <div>
                                <label class="form-label" for="fathersname">Father's Name</label>
                                <input type="text" class="form-control form-control-lg" id="fathersname"
                                    name="fathersname" placeholder="Father's Name">
                            </div>
                            <div>
                                <label class="form-label" for="email">Email <span style="color: red;">*</span></label>
                                <input type="email" class="form-control"
                                    pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}" id="email" name="email"
                                    placeholder="email" required>
                            </div>
                            <div>
                                <label class="form-label" for="phone">Phone Number</label>
                                <div class="input-group input-group-lg">
                                    <select name="countrycode" style="max-width: 130px;"
                                        class="form-select col-3 rounded-end-0" id="countrycode">
                                        <option value="">code</option>
                                        <option value="+91">+91</option>
                                    </select>
                                    <input type="number" class="form-control col-9" id="phone" min="6000000000"
                                        name="phone" placeholder="phone Number">
                                </div>
                            </div>
                            <div>
                                <label for="password" class="form-label">Password <span
                                        style="color: red;">*</span></label>
                                <div class="input-group">
                                    <input type="password" class="form-control"
                                        pattern=""
                                        id="password" name="password" placeholder="password" required>
                                    <button class="btn btn-outline-secondary passwordToggler" type="button">Show</button>
                                </div>
                                
                            </div>
                            <div>
                                <label for="password" class="form-label">Confirm Password <span
                                        style="color: red;">*</span></label>
                                <div class="input-group">
                                    <input type="password" class="form-control"
                                        pattern=""
                                        id="confirmPassword" name="confirmPassword" placeholder="password" required>
                                    <button class="btn btn-outline-secondary passwordToggler" type="button">Show</button>
                                </div>
                            </div>
                            <div>
                                <label for="country" class="form-label">Country</label>
                                <select name="country" class="form-select" id="country">
                                    <option value="">Select Country</option>
                                    <option value="India" selected>India</option>
                                    <option value="China">China</option>
                                    <option value="Nepal">Nepal</option>
                                    <option value="Bhutan">Bhutan</option>
                                    <option value="Bangladesh">Bangladesh</option>
                                    <option value="Mayanmar">Mayanmar</option>
                                    <option value="Srilanka">Srilanka</option>
                                    <option value="Pakistan">Pakistan</option>
                                </select>
                            </div>
                            <div>
                                <label for="dob" class="form-label">Date Of Birth <span
                                        style="color: red;">*</span></label>
                                <input type="date" class="form-control" id="dob" min="1966-07-10" max="2008-07-10"
                                    name="dob" placeholder="DOB" required>
                            </div>
                            <div>
                                <label class="form-label" for="gender">Gender</label>
                                <div>
                                    <div class="form-check form-check-inline">
                                        <input type="radio" class="form-check-input" id="male" name="gender"
                                            value="Male">
                                        <label for="male" class="form-check-label"> Male</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input type="radio" class="form-check-input" id="female" name="gender"
                                            value="Female">
                                        <label for="female" class="form-check-label">Female</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" id="others" name="gender"
                                            value="Others">
                                        <label for="others">
                                            Others
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="col">
                                <div class="form-group">
                                    <label for="skills" class="form-label">Skills</label>
                                    <div>
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" id="c" name="skills"
                                                value="C">
                                            <label for="c" class="form-check-label"> C</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="html" name="skills"
                                                value="Html">
                                            <label class="form-check-label" for="html">
                                                Html</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="python" name="skills"
                                                value="Python">
                                            <label class="form-check-label" for="python">Python</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="bootstrap" name="skills"
                                                value="Bootstrap">
                                            <label class="form-check-label" for="bootstrap">
                                                Bootstrap</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="javascript"
                                                name="skills" value="Javascript">
                                            <label class="form-check-label" for="javascript">
                                                Javascript</label>
                                        </div>
                                    </div>
                                </div>

                            </div>
                            <div class="col">
                                <div class="form-floating">
                                    <textarea name="bio" class="form-control" id="bio" rows="4" cols="40"
                                        placeholder="Enter your query here"></textarea>
                                    <label for="bio">BIO</label>
                                </div>
                            </div>
                        </div>

                        <button class="btn btn-primary mt-4">Submit</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script>
        let registrationForm = document.getElementById("registrationForm");
        registrationForm?.addEventListener("submit", function(ev){
            ev.preventDefault();
            console.log("User tried to submit the form");
            let serviceId = document.getElementById("serviceId")?.value
            let name = document.getElementById("name")?.value;
            let fathersname = document.getElementById("fathersname").value || "";
            let email = document.getElementById("email")?.value;
            let countrycode = document.getElementById("countrycode").value || "";
            let phone = document.getElementById("phone").value || "";
            let password = document.getElementById("password")?.value;
            let confirmPassword = document.getElementById("confirmPassword")?.value;
            let country = document.getElementById("country").value || "";
            let dob = document.getElementById("dob")?.value;
            let gender = document.querySelector("[name='gender']:checked")?.value;
            let selectedSkillsElms = document.querySelectorAll("[name='skills']:checked");
            let selectedSkills;
            if(selectedSkillsElms.length){
                selectedSkills = Array.from(selectedSkillsElms).map(el => el.value)
            }
            console.log(selectedSkills)
            let serviceErrorEl = document.getElementById("serviceErr")
            if(!serviceId){
                serviceErrorEl.textContent = "Service Id is required"
            }else{
                serviceErrorEl.textContent = "";
            }
            let namePattern = /^[a-zA-Z ]{3,24}$/;
            if(!name || !namePattern.test(name.trim())){
                console.log("Name is required and can have 3 to 24 characters")
            }
            let passPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&^#()_\-+=])[A-Za-z\d@$!%*?&^#()_\-+=]{8,32}$/;
             if(!password || !passPattern.test(password.trim())){
                console.log("Password is required and it must contain 1 lowercase, 1 uppercase, 1 digit and 1 special character and must be ateleast 8 characters long")
            }

            console.log(confirmPassword)
            if(!confirmPassword || !(confirmPassword === password)){
                console.log("password & confirm password must be same")
            }
        })

        let passwordTogglers  = document.querySelectorAll(".passwordToggler")
        passwordTogglers.forEach(toggler=>{
            toggler.addEventListener("click", function(e){
                let el = e.target
                let passwordEl =  el.closest(".input-group").querySelector("input")
                if(el.classList.contains("active")){
                    el.classList.remove('active');
                    el.textContent = "Show";
                    passwordEl.setAttribute("type", "password")
                }else{
                    el.classList.add('active');
                    el.textContent = "Hide"
                    passwordEl.setAttribute("type", "text")

                }
            })
        })
    </script>
</body>

</html>
