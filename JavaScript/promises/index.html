<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Promises</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <header><h1>JavaScript Promises</h1></header>
    <main>
        <h2>Products</h2>
        <div class="container">
            <div class="row g-4" id="products">

            </div>
        </div>
    </main>
    <script>
        const p1 = new Promise((resolve, reject)=>{
            // havy task that will take some time to compute
            setTimeout(()=>{
                let success = false;
            // if task completed successfully
                if(success){
                    resolve("Promise fullfilled")
                }else{
                    // if task didn't completed
                    reject("Promise rejected")
                }
            }, 5000)
            

        })

        p1
            .then((data)=> console.log(data))
            .catch((reason)=>{
                console.log(reason)
            })

        setTimeout(()=> console.log("from timeout"), 3000)
        console.log("After promise");


        // let products = fetch('https://fakestoreapi.com/products')
        // products.then(res => {
            
        //     console.log(res.status)
        //     if (res.status == 300){
        //         res.json().then((data)=> {
        //             console.log(data)
        //         })
        //     }else{
        //         throw new Error("Couldn't fetch products, pls try again later")
        //     }

        // }).catch((reason)=>{
        //     console.log(reason)
        // })

        async function fetchProducts(){
            try{
                let res = await fetch('https://fakestoreapi.com/products');
                let data = await res.json();
                
                // console.log(data)
                // if (res.status == 200){
                //     let data = await res.json()
                //     console.log(data)
                // }else{
                //     throw new Error("Couldn't fetch products, pls try again later")
                // }
                return data
            }catch(err){
                console.log(err)
                
            }
        }
        async function loadProduct(){
            let productsEl = document.getElementById("products");
            let loadingEl = document.createElement("div")
            loadingEl.textContent = "Loading..."
            productsEl.append(loadingEl)
            try{
                let products = await fetchProducts();
                renderProducts(productsEl, products)
            }catch(err){
                console.log(err)
            }finally{
                loadingEl.remove()
            }
            
        }
        loadProduct();

        function renderProducts(target, products){
            products.forEach(product => {
                // console.log(product)
                let productCard = document.createElement('div')
                productCard.classList.add("col-6")
                productCard.classList.add("col-lg-4")
                productCard.innerHTML = `
                    <div class="card d-flex flex-column h-100">
                        <img class="card-img-top" src="${product.image}">
                        <div class="card-body flex-grow-1">
                            <h3 class="card-title h6">${product.title}</h3>    
                        </div>
                    </div>
                `
                target.append(productCard)
            }); 
        }


        setTimeout(()=>{
            console.log("From Timeout")
        }, 5000);

        let count = 0;
        let interval1 = setInterval(()=>{
            count++;
            if(count == 10){
                clearInterval(interval1)
            }
            let date = new Date()
            console.log(`${date.getHours()} : ${date.getMinutes()} : ${date.getSeconds()}`);
        }, 1000)
        console.log(interval1)
    </script>
</body>
</html>
