<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CSS Transform</h1>
    </header>
    <main>
        <section>
            <h2>Translate</h2>
            <div class="box translate">Box 1</div>
            <div class="box rotate">Box 2</div>
            <div class="box scale">Box 3</div>
            <div class="box skew">Box 4</div>
            <div class="box origin">Box 5</div>
            <div class="box shorthand">Box 6</div>
        </section>
        <nav>
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Services</a>
            <a href="">Contact</a>
        </nav>
    </main>
</body>
</html>
