<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images and Pseudo classes</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
    <header>
        <h1>Images and Pseudo classes</h1>
    </header>
    <main>
        <div class="image-1">
            <img class="img-responsive" src="./images/ksKX8fXZ_cd6a13664f6f4eed88502c5a073a7047.jpg" alt="">
        </div>
       
        <div class="image-3">
            <img class="img-fill" src="./images/ksKX8fXZ_cd6a13664f6f4eed88502c5a073a7047.jpg" alt="">
        </div>
        <div class="image-3">
            <img class="img-cover" src="./images/ksKX8fXZ_cd6a13664f6f4eed88502c5a073a7047.jpg" alt="">
        </div>
        <div class="image-3">
            <img class="img-contain" src="./images/ksKX8fXZ_cd6a13664f6f4eed88502c5a073a7047.jpg" alt="">
        </div>
        <div class="image-2">
            <img class="img-thumbnail" src="./images/shopping.webp" alt="">
        </div>

        <div class="box rounded"></div>
        <div class="box rounded-top-left"></div>
        <div class="box rounded-top-right"></div>
        <div class="box rounded-bottom-left"></div>
        <div class="box rounded-bottom-right"></div>
        <div class="box rounded-custom"></div>
        <div class="box rounded-custom"></div>
        <div class="box rounded-circle"></div>
        <button class="rounded-pill">Click me</button>
        <button class="rounded-pill" disabled>Click me</button>
        <form action="">
            <input type="text" placeholder="Name" name="name" required>
            <input type="email" placeholder="Email" name="email" >
            <input type="number" placeholder="Age" name="age" min="18">
            <input type="submit" >
        </form>
    </main>
</body>
</html>
